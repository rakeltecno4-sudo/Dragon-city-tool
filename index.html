<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon City Tool</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: 80px auto;
      padding: 25px;
    }

    h1 {
      color: #ff4fd8;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #ff4fd8;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Dragon City Tool</h1>

    <p>Entre ton code de connexion</p>

    <input
      type="text"
      id="code"
      placeholder="Login Code"
    >

    <button onclick="login()">Se connecter</button>

    <button onclick="createCode()">Créer un code</button>

    <p id="message"></p>

  </div>

  <script>

    function createCode() {
      document.getElementById("message").textContent =
        "JavaScript fonctionne !";
    }

    function login() {
      document.getElementById("message").textContent =
        "Login fonctionne !";
    }

  </script>

</body>
</html>
