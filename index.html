<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon City Tool</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
    }

    h1 {
      color: #ff4fd8;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      border: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ff4fd8;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Dragon City Tool</h1>

    <p>Entre ton code de connexion</p>

    <input
      type="text"
      id="code"
      placeholder="Login Code"
    >

    <button onclick="login()">
      Se connecter
    </button>

    <p id="message"></p>
  </div>

  <script>
    function login() {
      const code = document.getElementById("code").value;

      if (code.trim() === "") {
        document.getElementById("message").textContent =
          "Entre un code.";
        return;
      }

      document.getElementById("message").textContent =
        "Code reçu. Le système de vérification sera ajouté ensuite.";
    }
  </script>

</body>
</html>
