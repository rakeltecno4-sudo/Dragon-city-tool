<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon City Tool</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: 80px auto;
      padding: 25px;
    }

    h1 {
      color: #ff4fd8;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #ff4fd8;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      color: #aaa;
    }
  </style>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <div class="container">
    <h1>Dragon City Tool</h1>

    <p>Entre ton code de connexion</p>

    <input
      type="text"
      id="code"
      placeholder="Login Code"
    >

    <button onclick="login()">Se connecter</button>

    <button onclick="createCode()">Créer un code</button>

    <p id="message"></p>
  </div>

  <script>
  const SUPABASE_URL = "https://pnnmnsnrlcawbugvdcrm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sbTIqckXExs7cK0bq1pq9g_6Sf27oo3";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

    function createCode() {
      const code =
        Math.floor(100000 + Math.random() * 900000);

      document.getElementById("message").textContent =
        "Ton code de démonstration : " + code;
    }

    function login() {
      const code = document.getElementById("code").value.trim();

      if (code === "") {
        document.getElementById("message").textContent =
          "Entre un code.";
        return;
      }

      document.getElementById("message").textContent =
        "Code reçu. Vérification à venir.";
    }
  </script>

</body>
</html>
